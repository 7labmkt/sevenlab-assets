<html lang="pt-BR" data-theme="day">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{NOME_CLIENTE}} — LabSights</title>
<link rel="icon" type="image/png" href="https://raw.githubusercontent.com/7labmkt/sevenlab-assets/main/modelos-html/labsights/assets/favicon.png">

<style>
  @import url('https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,700;0,900;1,700;1,900&family=Inter:wght@400;500;600;700&display=swap');

  :root{
    --off-white:#F3EDD6; --charcoal:#2B2622; --wine:#4C0013; --wine-active:#600B20;
    --wine-night:#B3536C; --wine-deep:#2E000B; --night-bg:#1E1A18;
    --bg:var(--off-white); --text:var(--charcoal); --text-muted:rgba(43,38,34,.62);
    --accent:var(--wine); --glass-bg:rgba(255,255,255,.28); --glass-border:rgba(43,38,34,.08);
    --card-bg:rgba(255,255,255,.6); --card-border:rgba(43,38,34,.1); --divider:rgba(43,38,34,.14);
    --up:#2F7A52; --down:#B3453F;
    --funil-topo:#587DA8; --funil-meio:#D4A938; --funil-fundo:#8C2726;
  }
  html[data-theme="night"]{
    --bg:var(--night-bg); --text:var(--off-white); --text-muted:rgba(243,237,214,.6);
    --accent:var(--wine-night); --glass-bg:rgba(255,255,255,.035); --glass-border:rgba(243,237,214,.1);
    --card-bg:rgba(255,255,255,.05); --card-border:rgba(243,237,214,.14); --divider:rgba(243,237,214,.16);
    --up:#5FBE8B; --down:#E08A85;
    --funil-topo:#769BC6; --funil-meio:#E8BD4C; --funil-fundo:#B44F4E;
  }

  *{ box-sizing:border-box; margin:0; padding:0; }
  html{ scroll-behavior:smooth; }
  body{ font-family:'Inter', sans-serif; background:transparent; color:var(--text); transition:color .8s ease; position:relative; }
  h1,h2,h3,h4{ font-family:'Inter',sans-serif; font-weight:600; }
  a{ color:inherit; text-decoration:none; }

  #bgScrub{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:-3; opacity:.5; filter:saturate(.85); }
  .bg-scrim{ position:fixed; inset:0; z-index:-2; background:var(--bg); opacity:.68; transition:background .8s ease, opacity .8s ease; }
  html[data-theme="night"] .bg-scrim{ opacity:.8; }

  header{
    position:sticky; top:0; z-index:30; display:grid; grid-template-columns:1fr auto 1fr; align-items:center;
    gap:12px; padding:14px 24px; background:var(--glass-bg); border-bottom:1px solid var(--glass-border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); transition:background .8s ease, border-color .8s ease;
  }
  .logos{ display:flex; align-items:center; gap:22px; min-width:0; }
  .sevenlab-logo{ height:24px; display:block; flex-shrink:0; }
  .cliente-nome{ font-weight:600; font-size:.95rem; color:var(--text); padding-left:22px; border-left:1px solid var(--divider); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .page-title{ font-family:'Merriweather',serif; font-style:italic; font-weight:700; font-size:1.05rem; text-align:center; color:var(--accent); transition:color .8s ease; white-space:nowrap; }
  html[data-theme="night"] .page-title{ color:var(--off-white); opacity:.95; }
  .header-right{ display:flex; align-items:center; justify-content:flex-end; gap:10px; flex-wrap:wrap; min-width:0; }
  .month-tabs{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
  /* Aba do mês anterior é só rótulo informativo — não clicável, sem alert() placeholder */
  .month-tab{ font-size:.72rem; font-weight:700; padding:7px 14px; border-radius:999px; background:var(--card-bg); border:1px solid var(--card-border); cursor:default; color:var(--text-muted); }
  .month-tab.active{ background:var(--accent); color:var(--off-white); border-color:var(--accent); }

  nav.scrollspy{
    position:sticky; z-index:29; display:flex; width:100%; top:56px; /* ajustado via JS conforme a altura real do header */
    background:var(--glass-bg); border-bottom:1px solid var(--glass-border);
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); transition:background .8s ease, border-color .8s ease;
  }
  nav.scrollspy a{ flex:1; text-align:center; font-size:.74rem; font-weight:700; padding:12px 6px; color:var(--text-muted); border-bottom:2px solid transparent; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  nav.scrollspy a.active{ color:var(--accent); border-bottom-color:var(--accent); }

  main{ max-width:1120px; margin:0 auto; padding:36px 24px 10px; }

  #heroScrim{
    position:fixed; top:0; left:0; width:100%; height:62vh; z-index:-1; pointer-events:none;
    background:linear-gradient(180deg, var(--bg) 0%, var(--bg) 32%, transparent 100%);
    opacity:.5; transition:background .8s ease;
  }
  .intro{ position:relative; text-align:center; margin-bottom:50px; padding:30px 24px 10px; will-change:opacity,transform; }
  .intro .saudacao{ font-family:'Merriweather',serif; font-style:italic; font-weight:700; font-size:1.15rem; margin-bottom:6px; opacity:.92; }
  .intro .eyebrow{ font-size:.7rem; letter-spacing:.14em; text-transform:uppercase; font-weight:700; color:var(--accent); margin-bottom:8px; }
  .intro h1{ font-family:'Merriweather',serif; font-style:italic; font-weight:700; font-size:clamp(1.5rem,4vw,2.2rem); margin-bottom:14px; }
  .intro .sinopse{ color:var(--text-muted); max-width:620px; margin:0 auto; line-height:1.65; font-size:.95rem; }

  section.camada{ margin-bottom:60px; scroll-margin-top:130px; position:relative; }
  .camada-header{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:4px; }
  .camada-header h2{ font-size:1.5rem; font-weight:700; }
  .tag-chip{ font-size:.68rem; font-weight:700; padding:4px 12px; border-radius:999px; background:var(--accent); color:var(--off-white); transition:background .8s ease; }
  .subtitulo-tag{ font-size:.78rem; color:var(--text-muted); flex-basis:100%; }
  .pergunta-guia{ color:var(--text-muted); font-size:.9rem; margin-bottom:20px; }

  .narrativa{ background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:20px; padding:20px 24px; margin-bottom:16px; font-size:.95rem; line-height:1.65; transition:background .8s ease, border-color .8s ease; }

  .bento{ display:grid; grid-template-columns:repeat(12,1fr); gap:14px; }
  .bento > *{ min-width:0; }
  .span-4{ grid-column:span 4; } .span-8{ grid-column:span 8; }
  @media (max-width:760px){ .bento > *{ grid-column:span 12 !important; } }

  .bento-card{ background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:22px; padding:20px; transition:background .8s ease, border-color .8s ease; }
  /* Evita que o PDF corte um card ao meio na quebra de página */
  .bento-card, .narrativa, .kpi-card, .funil-visual, .conclusao-col, .campanha-card{ break-inside:avoid; page-break-inside:avoid; }

  .kpi-big{ display:flex; flex-direction:column; justify-content:center; }
  .kpi-big .label{ font-size:.72rem; text-transform:uppercase; letter-spacing:.04em; color:var(--text-muted); margin-bottom:8px; font-weight:600; }
  .kpi-big .value{ font-family:'Merriweather',serif; font-weight:900; font-size:clamp(1.9rem,4vw,2.5rem); color:var(--accent); line-height:1; transition:color .8s ease; }
  .kpi-big .delta{ font-size:.78rem; margin-top:10px; font-weight:700; }
  .kpi-big .delta.up{ color:var(--up); } .kpi-big .delta.down{ color:var(--down); }

  .chart-title{ font-size:.78rem; font-weight:600; color:var(--text-muted); margin-bottom:10px; }
  .chart-canvas-wrap{ height:190px; position:relative; }
  .chart-fallback{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:.72rem; color:var(--text-muted); }

  .reveal{ opacity:0; transform:translateY(14px); transition:opacity .55s ease, transform .55s ease; }
  .reveal.in{ opacity:1; transform:translateY(0); }

  .kpi-row{ display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:14px; margin-bottom:16px; }
  .kpi-card{ background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:18px; padding:18px 14px; text-align:center; }
  .kpi-card .valor{ font-family:'Merriweather',serif; font-weight:900; font-size:1.6rem; color:var(--accent); }
  .kpi-card .label{ font-size:.72rem; color:var(--text-muted); margin-top:4px; }

  .campanhas-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:14px; }
  .campanha-card h4{ font-size:1rem; margin-bottom:4px; }
  .campanha-card .objetivo{ font-size:.76rem; color:var(--text-muted); margin-bottom:14px; line-height:1.5; }
  .campanha-metricas{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
  .campanha-metrica{ font-size:.78rem; }
  .campanha-metrica b{ display:block; font-family:'Merriweather',serif; font-weight:900; font-size:1.05rem; color:var(--accent); }

  /* Funil "flat com profundidade" — trapézios em SVG, cor derivada de --funil-topo/--funil-meio/--funil-fundo
     (varia por tema dia/noite), com hover/tap revelando o valor absoluto de cada etapa. Generalizado para
     N estágios, mas a skill sempre monta 3: Visibilidade → Interesse → Intenção. */
  .funil-visual{ max-width:420px; margin:14px auto 10px; }
  .funil-visual svg{ width:100%; height:auto; display:block; }
  .funil-tier-group{ cursor:pointer; transition:filter .2s ease, transform .2s ease; transform-box:fill-box; transform-origin:center; }
  .funil-tier-group:hover{ filter:saturate(1.35) brightness(1.04); transform:scale(1.045); }
  .funil-svg-label{ fill:var(--off-white); font-family:'Inter',sans-serif; font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:.04em; }
  .funil-svg-value{ fill:var(--off-white); font-family:'Merriweather',serif; font-weight:900; font-size:19px; }
  .funil-appendix{ text-align:center; font-size:.78rem; color:var(--text-muted); margin:6px 0 18px; min-height:1.2em; transition:color .3s ease; }

  /* Top post — duas molduras retangulares lado a lado (IG + FB). aspect-ratio 2.6/1
     acomoda o print inteiro da tela "Top posts" do Meta (vários posts lado a lado),
     não um post isolado — nunca recortar só o primeiro post da fileira. */
  .top-post-grid{ display:grid; grid-template-columns:1fr 1fr; gap:14px; margin-top:16px; }
  @media (max-width:560px){ .top-post-grid{ grid-template-columns:1fr; } }
  .top-post-frame{ background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:22px; padding:20px; overflow:hidden; transition:background .8s ease, border-color .8s ease; }
  .top-post-frame .img-box{ width:100%; aspect-ratio:2.6/1; overflow:hidden; border-radius:14px; background:var(--divider); }
  .top-post-frame .img-box img{ width:100%; height:100%; object-fit:cover; object-position:center; display:block; }
  .top-post-frame .plataforma{ font-size:.68rem; font-weight:700; text-transform:uppercase; letter-spacing:.04em; color:var(--accent); margin:10px 0 4px; transition:color .8s ease; }
  .top-post-frame .cap{ font-size:.78rem; color:var(--text-muted); line-height:1.5; }

  .conclusao-cols{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:16px; margin-top:18px; }
  .conclusao-col{ background:var(--card-bg); border:1px solid var(--card-border); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border-radius:18px; padding:18px; }
  .conclusao-col h4{ font-size:.85rem; margin-bottom:10px; }
  .conclusao-col ul{ padding-left:18px; font-size:.85rem; line-height:1.6; color:var(--text-muted); }

  footer{ text-align:center; padding:50px 24px 34px; margin-top:20px; background:#102B1F; color:var(--off-white); transition:background .8s ease; }
  html[data-theme="night"] footer{ background:var(--charcoal); }
  footer .mantra{ font-family:'Merriweather',serif; font-style:italic; font-size:1rem; opacity:.9; margin-bottom:20px; }
  footer .btn{ display:inline-block; margin-bottom:26px; background:var(--wine); color:var(--off-white); font-weight:700; font-size:.8rem; padding:12px 26px; border-radius:999px; }
  .footer-contatos{ display:flex; flex-wrap:wrap; justify-content:center; gap:18px; font-size:.78rem; color:rgba(243,237,214,.8); margin-bottom:18px; }
  .footer-contatos a:hover{ color:var(--wine-night); }
  footer .fine{ font-size:.68rem; color:rgba(243,237,214,.45); }
  footer .fine a{ text-decoration:underline; }

  @media (max-width:680px){
    header{ grid-template-columns:1fr; justify-items:center; row-gap:8px; }
    .page-title{ order:-1; }
    .header-right{ justify-content:center; }
    .cliente-nome{ padding-left:12px; }
  }
  @media (max-width:600px){
    nav.scrollspy a{ font-size:.6rem; padding:10px 2px; }
  }

  /* CAPTURA ESTÁTICA (PDF) — aplicado via JS quando detecta o headless do PDFShift,
     e também como fallback puro-CSS caso o navegador force media=print de outra forma. */
  html.pdf-capturing header, html.pdf-capturing nav.scrollspy, html.pdf-capturing #bgScrub,
  html.pdf-capturing .bg-scrim, html.pdf-capturing #heroScrim, html.pdf-capturing #downloadPdfBtn{
    display:none !important;
  }
  html.pdf-capturing .reveal{ opacity:1 !important; transform:none !important; }
  @media print{
    header, nav.scrollspy, #bgScrub, .bg-scrim, #heroScrim, #downloadPdfBtn{ display:none !important; }
    .reveal{ opacity:1 !important; transform:none !important; }
    body{ background:var(--bg) !important; }
  }
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script>
/* DASHBOARD_DATA — no arquivo final, substituído por {{DASHBOARD_DATA_JSON}}. Base: Belle — Fevereiro/2026. */
/* Este placeholder é substituído por inteiro (pelo Claude, na hora de gerar o relatório de cada cliente)
   pelo objeto JSON real do mês — nunca deixar dados de um cliente específico aqui no arquivo-modelo. */
const DASHBOARD_DATA = {{DASHBOARD_DATA_JSON}};

function formatShort(value){
  const abs = Math.abs(value);
  if (abs >= 1000000) return (value/1000000).toLocaleString('pt-BR',{maximumFractionDigits:1}) + ' mi';
  if (abs >= 1000) return (value/1000).toLocaleString('pt-BR',{maximumFractionDigits:0}) + ' mil';
  return value.toLocaleString('pt-BR');
}
function calcDelta(valores){
  if (!valores || valores.length < 2) return null;
  const last = valores[valores.length-1], prev = valores[valores.length-2];
  if (!prev) return null;
  const pct = ((last - prev) / prev) * 100;
  return { pct: Math.round(pct*10)/10, up: pct >= 0 };
}

function shadeColor(hex, percent){
  hex = (hex || '#4C0013').trim().replace('#','');
  if (hex.length === 3) hex = hex.split('').map(c=>c+c).join('');
  const num = parseInt(hex,16);
  let r = (num >> 16) + Math.round(255*percent/100);
  let g = ((num >> 8) & 0x00FF) + Math.round(255*percent/100);
  let b = (num & 0x0000FF) + Math.round(255*percent/100);
  r = Math.min(255,Math.max(0,r)); g = Math.min(255,Math.max(0,g)); b = Math.min(255,Math.max(0,b));
  return '#' + (0x1000000 + r*0x10000 + g*0x100 + b).toString(16).slice(1);
}
function chartJsType(tipo){
  if (tipo === 'barras') return 'bar';
  if (tipo === 'rosca') return 'doughnut';
  return 'line'; // 'linha' ou fallback — só usar quando a evolução no tempo for de fato o que importa contar
}

const chartRegistry = {}; const chartInstances = {};
function registerChart(canvasId, tipo, labels, valores){ chartRegistry[canvasId] = { type: tipo, labels, valores }; }
/* grafico_mes — comparação categórica com mais de uma série por categoria (ex: "orgânico vs. anúncios",
   "Instagram vs. Facebook"). Sempre renderiza em barras agrupadas, nunca linha — ligar categorias com uma
   linha sugeriria uma evolução temporal que não existe. Para 1 série só, use tendencia + tipo:"barras"
   (registerChart); quando há mais de uma série por categoria, use grafico_mes (esta função). */
function registerMultiBarChart(canvasId, labels, datasets){ chartRegistry[canvasId] = { type: 'bar_multi', labels, datasets }; }

function renderKpis(kpis){
  return kpis.map(k => `<div class="kpi-card reveal"><div class="valor">${k.valor}</div><div class="label">${k.label}</div></div>`).join('');
}
function renderCampanhasGrid(campanhas){
  if (!campanhas || !campanhas.length) return '';
  const cards = campanhas.map((c, i) => {
    const canvasId = `chart-campanha-${i}`;
    registerChart(canvasId, c.serie_temporal.tipo || 'linha', c.serie_temporal.labels, c.serie_temporal.valores);
    return `
      <div class="bento-card campanha-card reveal">
        <h4>${c.nome}</h4>
        <p class="objetivo">${c.objetivo}</p>
        <div class="campanha-metricas">
          <div class="campanha-metrica"><b>${c.metricas.alcance}</b>Alcance</div>
          <div class="campanha-metrica"><b>${c.metricas.impressoes}</b>Impressões</div>
          <div class="campanha-metrica"><b>${c.metricas.valor_investido}</b>Valor investido</div>
          <div class="campanha-metrica"><b>${c.metricas.custo_por_resultado}</b>Custo por resultado</div>
        </div>
        <div class="chart-title">${c.serie_temporal.titulo} <span style="opacity:.6;font-weight:400;">(dado ${c.granularidade})</span></div>
        <div class="chart-canvas-wrap" style="height:130px;"><canvas id="${canvasId}"></canvas></div>
      </div>`;
  }).join('');
  return `<div class="campanhas-grid">${cards}</div>`;
}
function renderTopPost(topPost){
  if (!topPost || (!topPost.imagem_ig && !topPost.imagem_fb)) return '';
  const legendaPadrao = 'Publicação em destaque no mês';
  const frame = (url, label, legenda) => url ? `
    <div class="top-post-frame reveal">
      <div class="img-box"><img src="${url}" alt="Post em destaque — ${label}" loading="lazy"></div>
      <div class="plataforma">👑 Top Posts: ${label}</div>
      <div class="cap">${legenda || legendaPadrao}</div>
    </div>` : '';
  return `<div class="top-post-grid">${frame(topPost.imagem_ig, 'Instagram', topPost.legenda_ig || topPost.legenda)}${frame(topPost.imagem_fb, 'Facebook', topPost.legenda_fb || topPost.legenda)}</div>`;
}
function renderCamada(id, titulo, pergunta, camada){
  if (!camada || camada.ativa === false) return '';
  const tagHtml = camada.tag ? `<span class="tag-chip">${camada.tag}</span>` : '';
  const subtituloHtml = camada.subtitulo_tag ? `<div class="subtitulo-tag">${camada.subtitulo_tag}</div>` : '';
  const campanhasHtml = camada.campanhas ? renderCampanhasGrid(camada.campanhas) : '';

  let bodyHtml = '';
  let graficoMesHtml = '';
  if (camada.grafico_mes){
    const canvasId = `chart-mes-${id}`;
    registerMultiBarChart(canvasId, camada.grafico_mes.labels, camada.grafico_mes.datasets);
    graficoMesHtml = `<div class="bento-card reveal" style="margin-bottom:16px;"><div class="chart-title">${camada.grafico_mes.titulo||''}</div><div class="chart-canvas-wrap"><canvas id="${canvasId}"></canvas></div></div>`;
  }
  if (camada.kpis && camada.kpis.length === 1 && camada.tendencia){
    const canvasId = `chart-${id}`;
    registerChart(canvasId, camada.tendencia.tipo || 'linha', camada.tendencia.labels, camada.tendencia.valores);
    const delta = calcDelta(camada.tendencia.valores);
    const deltaHtml = delta ? `<div class="delta ${delta.up?'up':'down'}">${delta.up?'▲':'▼'} ${Math.abs(delta.pct)}% vs. mês anterior</div>` : '';
    bodyHtml = `
      <div class="bento">
        <div class="bento-card kpi-big span-4 reveal">
          <div class="label">${camada.kpis[0].label}</div>
          <div class="value">${camada.kpis[0].valor}</div>
          ${deltaHtml}
        </div>
        <div class="bento-card span-8 reveal">
          <div class="chart-title">${camada.tendencia.titulo || ''}</div>
          <div class="chart-canvas-wrap"><canvas id="${canvasId}"></canvas></div>
        </div>
      </div>` + graficoMesHtml;
  } else {
    const kpisHtml = camada.kpis && camada.kpis.length ? `<div class="kpi-row">${renderKpis(camada.kpis)}</div>` : '';
    let chartHtml = '';
    if (camada.tendencia){
      const canvasId = `chart-${id}`;
      registerChart(canvasId, camada.tendencia.tipo || 'linha', camada.tendencia.labels, camada.tendencia.valores);
      chartHtml = `<div class="bento-card reveal" style="margin-bottom:16px;"><div class="chart-title">${camada.tendencia.titulo||''}</div><div class="chart-canvas-wrap"><canvas id="${canvasId}"></canvas></div></div>`;
    }
    bodyHtml = kpisHtml + chartHtml + graficoMesHtml;
  }

  const topPostHtml = renderTopPost(camada.top_post);

  return `
    <section class="camada" id="${id}">
      <div class="camada-header"><h2>${titulo}</h2>${tagHtml}${subtituloHtml}</div>
      <p class="pergunta-guia">${pergunta}</p>
      <div class="narrativa reveal">${camada.narrativa}</div>
      ${bodyHtml}
      ${campanhasHtml}
      ${topPostHtml}
    </section>`;
}
function funilPalette(){
  const style = getComputedStyle(document.documentElement);
  const topo = (style.getPropertyValue('--funil-topo') || '').trim() || '#587DA8';
  const meio = (style.getPropertyValue('--funil-meio') || '').trim() || '#D4A938';
  const fundo = (style.getPropertyValue('--funil-fundo') || '').trim() || '#8C2726';
  return [topo, meio, fundo];
}
function renderFunil(funil){
  const n = funil.estagios.length;
  const palette = funilPalette();
  const cx = 210, ry = 16, gap = 25, topPad = 30;
  let rxTop = 168;
  /* A altura de cada camada é proporcional à sua largura (em vez de fixa), mantendo a mesma
     "achatura" visual do topo também nas camadas mais estreitas — evita o efeito de balde alto
     no fundo do funil. */
  const bandHBase = 100, aspect = bandHBase / rxTop, bandHMin = 56;
  const rows = [];
  let yCursor = topPad;
  for (let i = 0; i < n; i++){
    const rxBottom = rxTop * 0.80;
    const bandH = Math.max(bandHMin, aspect * ((rxTop + rxBottom) / 2));
    const yTop = yCursor;
    const yBottom = yTop + bandH;
    const fill = palette[i % palette.length];
    const rim = shadeColor(fill, -38);
    rows.push({ i, rxTop, rxBottom, yTop, yBottom, fill, rim, estagio: funil.estagios[i] });
    yCursor = yBottom + gap;
    rxTop = rxBottom * 0.82;
  }
  const totalH = rows[rows.length - 1].yBottom + 20;

  const groups = rows.slice().reverse().map(r => {
    const appendix = (r.estagio.valor_abs || '').replace(/"/g, '&quot;');
    const d = `M${cx - r.rxTop},${r.yTop} L${cx - r.rxBottom},${r.yBottom} A${r.rxBottom},${ry} 0 0,0 ${cx + r.rxBottom},${r.yBottom} L${cx + r.rxTop},${r.yTop} Z`;
    const textCenter = r.yTop + (r.yBottom - r.yTop + ry) / 2;
    return `
      <g class="funil-tier-group" data-idx="${r.i}" data-appendix="${appendix}">
        <path d="${d}" fill="${r.fill}"/>
        <ellipse cx="${cx}" cy="${r.yTop}" rx="${r.rxTop}" ry="${ry}" fill="${r.rim}"/>
        <text x="${cx}" y="${textCenter - 3}" text-anchor="middle" class="funil-svg-label">${r.estagio.label}</text>
        <text x="${cx}" y="${textCenter + 19}" text-anchor="middle" class="funil-svg-value">${r.estagio.valor}</text>
      </g>`;
  }).join('');

  return `
    <section class="camada" id="funil">
      <div class="camada-header"><h2>⚡ Velocidade do Funil</h2></div>
      <p class="pergunta-guia">Quantas pessoas avançam de uma etapa para a próxima</p>
      <div class="funil-visual reveal">
        <svg viewBox="0 0 420 ${totalH}" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">${groups}</svg>
      </div>
      <div class="funil-appendix" id="funilAppendix">Passe o mouse (ou toque) numa etapa para ver o número absoluto.</div>
      <div class="narrativa reveal">${funil.diagnostico}</div>
    </section>`;
}
function refreshFunilColors(){
  const palette = funilPalette();
  document.querySelectorAll('.funil-tier-group').forEach(g => {
    const i = parseInt(g.dataset.idx, 10) || 0;
    const fill = palette[i % palette.length];
    const path = g.querySelector('path');
    const ellipse = g.querySelector('ellipse');
    if (path) path.setAttribute('fill', fill);
    if (ellipse) ellipse.setAttribute('fill', shadeColor(fill, -38));
  });
}
function setupFunilHover(){
  const appendixEl = document.getElementById('funilAppendix');
  if (!appendixEl) return;
  const defaultText = appendixEl.textContent;
  document.querySelectorAll('.funil-tier-group').forEach(g => {
    const showAppendix = () => { appendixEl.textContent = g.dataset.appendix || defaultText; };
    const hideAppendix = () => { appendixEl.textContent = defaultText; };
    g.addEventListener('mouseenter', showAppendix);
    g.addEventListener('mouseleave', hideAppendix);
    g.addEventListener('click', showAppendix);
  });
}
function renderConclusao(c){

function currentAccent(){ return getComputedStyle(document.documentElement).getPropertyValue('--accent').trim(); }
function chartThemeColors(){
  const style = getComputedStyle(document.documentElement);
  return {
    text: (style.getPropertyValue('--text-muted') || '').trim() || 'rgba(0,0,0,.6)',
    grid: (style.getPropertyValue('--divider') || '').trim() || 'rgba(0,0,0,.1)'
  };
}
function buildChart(canvasId){
  const spec = chartRegistry[canvasId]; const canvas = document.getElementById(canvasId);
  if (!spec || !canvas) return;
  const accent = currentAccent();
  const theme = chartThemeColors();
  const capturing = document.documentElement.classList.contains('pdf-capturing');

  if (spec.type === 'bar_multi'){
    const datasets = spec.datasets.map((ds, i) => ({
      label: ds.label, data: ds.valores,
      backgroundColor: shadeColor(accent, i === 0 ? 0 : -22 * i), borderRadius: 6
    }));
    chartInstances[canvasId] = new Chart(canvas, {
      type: 'bar',
      data: { labels: spec.labels, datasets },
      options: {
        responsive:true, maintainAspectRatio:false,
        animation: capturing ? false : { duration:900, easing:'easeOutQuart' },
        plugins:{ legend:{ display: datasets.length > 1, position:'bottom', labels:{ color: theme.text, font:{size:10}, boxWidth:12 } } },
        scales:{
          y:{ beginAtZero:true, ticks:{ font:{size:9}, color: theme.text, maxTicksLimit:5, callback:(v)=>formatShort(v) }, grid:{ color: theme.grid } },
          x:{ ticks:{ font:{size:9}, color: theme.text }, grid:{ display:false } }
        }
      }
    });
    return;
  }

  const jsType = chartJsType(spec.type);
  let dataset;
  if (jsType === 'doughnut'){
    dataset = { data: spec.valores, backgroundColor: spec.valores.map((_, i) => shadeColor(accent, i * -14)), borderWidth: 0 };
  } else {
    dataset = { data: spec.valores, borderColor: accent, backgroundColor: jsType === 'bar' ? accent : 'transparent', tension:.35, pointRadius:3, borderRadius: jsType==='bar'?6:0 };
  }

  const options = {
    responsive:true, maintainAspectRatio:false,
    animation: capturing ? false : { duration:900, easing:'easeOutQuart' },
    plugins:{ legend:{ display: jsType==='doughnut', position:'bottom', labels:{ color: theme.text, font:{size:10}, boxWidth:12 } } }
  };
  if (jsType !== 'doughnut'){
    options.scales = {
      y:{ beginAtZero:true, ticks:{ font:{size:9}, color: theme.text, maxTicksLimit:5, callback:(v)=>formatShort(v) }, grid:{ color: theme.grid } },
      x:{ ticks:{ font:{size:9}, color: theme.text }, grid:{ display:false } }
    };
  }

  chartInstances[canvasId] = new Chart(canvas, { type: jsType, data: { labels: spec.labels, datasets: [dataset] }, options });
}
function refreshChartColors(){
  const accent = currentAccent();
  const theme = chartThemeColors();
  Object.entries(chartInstances).forEach(([id, chart]) => {
    const spec = chartRegistry[id];
    if (spec.type === 'bar_multi'){
      chart.data.datasets.forEach((ds, i) => { ds.backgroundColor = shadeColor(accent, i === 0 ? 0 : -22 * i); });
      if (chart.options.plugins?.legend?.labels) chart.options.plugins.legend.labels.color = theme.text;
      if (chart.options.scales?.y?.ticks) chart.options.scales.y.ticks.color = theme.text;
      if (chart.options.scales?.y?.grid) chart.options.scales.y.grid.color = theme.grid;
      if (chart.options.scales?.x?.ticks) chart.options.scales.x.ticks.color = theme.text;
      chart.update('none');
      return;
    }
    const jsType = chartJsType(spec.type);
    if (jsType === 'doughnut'){
      chart.data.datasets[0].backgroundColor = spec.valores.map((_, i) => shadeColor(accent, i * -14));
    } else {
      chart.data.datasets[0].borderColor = accent;
      if (jsType === 'bar') chart.data.datasets[0].backgroundColor = accent;
    }
    if (chart.options.plugins?.legend?.labels) chart.options.plugins.legend.labels.color = theme.text;
    if (chart.options.scales?.y?.ticks) chart.options.scales.y.ticks.color = theme.text;
    if (chart.options.scales?.y?.grid) chart.options.scales.y.grid.color = theme.grid;
    if (chart.options.scales?.x?.ticks) chart.options.scales.x.ticks.color = theme.text;
    chart.update('none');
  });
}
function setupLazyCharts(){
  try {
    if (typeof Chart === 'undefined') throw new Error('Chart.js não carregou.');
    const observer = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting){
          const canvas = entry.target.querySelector('canvas');
          if (canvas && !chartInstances[canvas.id]) buildChart(canvas.id);
          entry.target.classList.add('in');
          observer.unobserve(entry.target);
        }
      });
    }, { threshold:.25 });
    document.querySelectorAll('.chart-canvas-wrap').forEach(el => observer.observe(el.closest('.reveal') || el));
  } catch(err){
    console.error('Gráficos indisponíveis:', err);
    document.querySelectorAll('.chart-canvas-wrap').forEach(el => el.insertAdjacentHTML('beforeend', '<div class="chart-fallback">Gráfico indisponível no momento</div>'));
  }
}
function setupReveal(){
  const observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => { if (entry.isIntersecting){ entry.target.classList.add('in'); observer.unobserve(entry.target); } });
  }, { threshold:.2 });
  document.querySelectorAll('.reveal').forEach(el => observer.observe(el));
}

/* SCROLLSPY */
function setupScrollspy(){
  const sections = () => Array.from(document.querySelectorAll('section.camada'));
  const navLinks = document.querySelectorAll('nav.scrollspy a');
  function onScroll(){
    const triggerY = window.scrollY + window.innerHeight * 0.51;
    let current = sections()[0] && sections()[0].id;
    sections().forEach(sec => { if (triggerY >= sec.offsetTop) current = sec.id; });
    const atBottom = (window.innerHeight + window.scrollY) >= (document.documentElement.scrollHeight - 2);
    if (atBottom) current = sections()[sections().length - 1].id;
    navLinks.forEach(link => link.classList.toggle('active', link.getAttribute('href') === '#' + current));
  }
  window.addEventListener('scroll', onScroll);
  navLinks.forEach(link => link.addEventListener('click', e => {
    e.preventDefault();
    const target = document.querySelector(link.getAttribute('href'));
    if (target) window.scrollTo({ top: target.offsetTop - 110, behavior:'smooth' });
  }));
  onScroll();
}

/* HEADER STICKY DINÂMICO — a barra de seções sempre gruda logo abaixo do header, não importa quantas linhas ele ocupe no mobile */
function syncHeaderHeight(){
  const header = document.querySelector('header');
  const nav = document.querySelector('nav.scrollspy');
  if (header && nav) nav.style.top = header.offsetHeight + 'px';
}

/* DIA/NOITE */
function setTheme(isNight){
  document.documentElement.setAttribute('data-theme', isNight ? 'night' : 'day');
  const logo = document.getElementById('sevenlabLogo');
  if (logo) logo.src = isNight
    ? 'https://raw.githubusercontent.com/7labmkt/sevenlab-assets/main/brand/off_sevenlab_logo.png'
    : 'https://raw.githubusercontent.com/7labmkt/sevenlab-assets/main/brand/wine_sevenlab_logo.png';
  refreshChartColors();
  refreshFunilColors();
}
function applyThemeByClock(){ const h = new Date().getHours(); setTheme(h >= 18 || h < 6); }

/* VÍDEO DE FUNDO — por ora, autoplay/loop simples (scroll-scrubbing volta numa próxima sessão, estava travando) */

/* FADE DO HERO NO SCROLL — texto e scrim somem juntos conforme desce, "cedendo o protagonismo" ao fundo */
function setupHeroFade(){
  const intro = document.querySelector('.intro');
  const scrim = document.getElementById('heroScrim');
  if (!intro) return;
  const fadeRange = 480; // px de rolagem até desaparecer por completo
  function update(){
    const p = Math.min(Math.max(window.scrollY / fadeRange, 0), 1);
    intro.style.opacity = 1 - p;
    intro.style.transform = `translateY(${-24 * p}px)`;
    if (scrim) scrim.style.opacity = 0.5 * (1 - p);
  }
  window.addEventListener('scroll', () => requestAnimationFrame(update));
  update();
}

/* CAPTURA ESTÁTICA (PDF) — detecta se quem está carregando a página é o navegador
   headless do PDFShift (Puppeteer sempre expõe navigator.webdriver=true) ou o próprio
   modo de impressão, e força tudo a aparecer de uma vez (sem esperar scroll), sem
   animação de gráfico no meio do caminho — evita o bug antigo de captura pela metade. */
window.__pageReadyFlag = false;
window.isPageReady = function(){ return window.__pageReadyFlag; };
function isCaptureContext(){
  try { return navigator.webdriver === true || window.matchMedia('print').matches; }
  catch(e){ return false; }
}
function prepareForStaticCapture(){
  document.documentElement.classList.add('pdf-capturing');
  Object.keys(chartRegistry).forEach(id => { if (!chartInstances[id]) buildChart(id); });
  document.querySelectorAll('.reveal').forEach(el => el.classList.add('in'));
  window.__pageReadyFlag = true;
}

/* INIT */
applyThemeByClock();
renderStaticContent(DASHBOARD_DATA);
try { syncHeaderHeight(); window.addEventListener('resize', syncHeaderHeight); window.addEventListener('load', syncHeaderHeight); } catch(e){ console.error('HeaderSync:', e); }
try { setupScrollspy(); } catch(e){ console.error('Scrollspy:', e); }
try { setupReveal(); } catch(e){ console.error('Reveal:', e); }
try { setupFunilHover(); } catch(e){ console.error('FunilHover:', e); }

if (isCaptureContext()){
  try { prepareForStaticCapture(); } catch(e){ console.error('StaticCapture:', e); window.__pageReadyFlag = true; }
} else {
  try { setupLazyCharts(); } catch(e){ console.error('Charts:', e); }
  try { setupHeroFade(); } catch(e){ console.error('HeroFade:', e); }
  window.__pageReadyFlag = true;
}
